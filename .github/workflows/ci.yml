name: EduEdge CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall eduedge
      - name: Validate JSON
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json')]"
      - name: Validate frontend entry scripts
        run: |
          node --check eduedge/public/js/education/student_admission.js
          node --check eduedge/public/js/education/student_applicant.js
          node --check eduedge/public/js/education/program_enrollment.js
          node --check eduedge/public/js/education/student_group.js
          node --check eduedge/public/js/education/room.js
          node --check eduedge/public/js/education/course_schedule.js
          node --check eduedge/public/js/education/student_attendance.js
          node --check eduedge/public/js/education/assessment_plan.js
          node --check eduedge/public/js/education/assessment_result.js
          node --check eduedge/eduedge/doctype/eduedge_school_branch/eduedge_school_branch.js
          node --check eduedge/eduedge/doctype/eduedge_user_branch_access/eduedge_user_branch_access.js
          node --check eduedge/eduedge/doctype/eduedge_program_offering/eduedge_program_offering.js
          node --check eduedge/eduedge/doctype/eduedge_instructor_branch_assignment/eduedge_instructor_branch_assignment.js
          node --check eduedge/eduedge/doctype/eduedge_result_publication/eduedge_result_publication.js
          node --check eduedge/eduedge/doctype/eduedge_report_card_review/eduedge_report_card_review.js
          node --check eduedge/public/js/eduedge_ui/navigation.js
          node --check eduedge/public/js/eduedge_product_menu.bundle.js
          node --check eduedge/public/js/eduedge_home.bundle.js
          node --check eduedge/public/js/eduedge_academic_operations.bundle.js
          node --check eduedge/public/js/eduedge_assessment_operations.bundle.js
          node --check eduedge/public/js/eduedge_report_cards.bundle.js
          node --check eduedge/public/js/eduedge_branch_governance.bundle.js
          node --check eduedge/eduedge/page/eduedge_home/eduedge_home.js
          node --check eduedge/eduedge/page/eduedge_setup_center/eduedge_setup_center.js
          node --check eduedge/eduedge/page/eduedge_academic_operations/eduedge_academic_operations.js
          node --check eduedge/eduedge/page/eduedge_assessment_operations/eduedge_assessment_operations.js
          node --check eduedge/eduedge/page/eduedge_report_cards/eduedge_report_cards.js
          node --check eduedge/eduedge/page/eduedge_branch_governance/eduedge_branch_governance.js
      - name: Run pure contract tests
        run: python -m unittest discover -s eduedge/tests -p "test_*.py"
