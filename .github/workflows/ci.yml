name: EduEdge CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall eduedge
      - name: Validate JSON
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('*.json')]"
      - name: Validate frontend entry scripts
        run: |
          node --check eduedge/public/js/education/program.js
          node --check eduedge/public/js/education/course.js
          node --check eduedge/public/js/education/student_admission.js
          node --check eduedge/public/js/education/student_applicant.js
          node --check eduedge/public/js/education/program_enrollment.js
          node --check eduedge/public/js/education/student_group.js
          node --check eduedge/public/js/education/room.js
          node --check eduedge/public/js/education/course_schedule.js
          node --check eduedge/public/js/education/student_attendance.js
          node --check eduedge/public/js/education/assessment_plan.js
          node --check eduedge/public/js/education/assessment_result.js
          node --check eduedge/eduedge/doctype/eduedge_school_branch/eduedge_school_branch.js
          node --check eduedge/eduedge/doctype/eduedge_user_branch_access/eduedge_user_branch_access.js
          node --check eduedge/eduedge/doctype/eduedge_program_offering/eduedge_program_offering.js
          node --check eduedge/eduedge/doctype/eduedge_instructor_branch_assignment/eduedge_instructor_branch_assignment.js
          node --check eduedge/eduedge/doctype/eduedge_result_publication/eduedge_result_publication.js
          node --check eduedge/eduedge/doctype/eduedge_report_card_review/eduedge_report_card_review.js
          node --check eduedge/eduedge/doctype/eduedge_examination_centre/eduedge_examination_centre.js
          node --check eduedge/eduedge/doctype/eduedge_cbt_question/eduedge_cbt_question.js
          node --check eduedge/eduedge/doctype/eduedge_cbt_exam_template/eduedge_cbt_exam_template.js
          node --check eduedge/eduedge/doctype/eduedge_cbt_exam_schedule/eduedge_cbt_exam_schedule.js
          node --check eduedge/eduedge/doctype/eduedge_cbt_candidate_assignment/eduedge_cbt_candidate_assignment.js
          node --check eduedge/public/js/eduedge_cbt_runtime_storage.js
          node --check eduedge/public/js/eduedge_cbt_candidate.js
          node --check eduedge/public/js/eduedge_cbt_candidate_serialization.js
          node --check eduedge/public/js/eduedge_cbt_invigilation.bundle.js
          node --check eduedge/public/js/eduedge_cbt_marking.bundle.js
          node --check eduedge/public/js/eduedge_cbt_attempt_review.bundle.js
          node --check eduedge/public/js/eduedge_ui/app_factory.js
          node --check eduedge/public/js/eduedge_ui/native_frappe_dialog.js
          node --check eduedge/public/js/eduedge_ui/navigation.js
          node --check eduedge/public/js/eduedge_ui/resource_modal.js
          node --check eduedge/public/js/eduedge_terminology.bundle.js
          node --check eduedge/public/js/eduedge_profile_identity.bundle.js
          node --check eduedge/public/js/eduedge_shell_identity.bundle.js
          node --check eduedge/public/js/eduedge_institution_structure.bundle.js
          node --check eduedge/public/js/eduedge_academic_foundation.bundle.js
          node --check eduedge/public/js/eduedge_academic_foundation/qa_fixes.js
          node --check eduedge/public/js/eduedge_programmes.bundle.js
          node --check eduedge/public/js/eduedge_programme_offerings.bundle.js
          node --check eduedge/public/js/eduedge_class_arms.bundle.js
          node --check eduedge/public/js/eduedge_product_menu.bundle.js
          node --check eduedge/public/js/eduedge_resource_page_loader.bundle.js
          node --check eduedge/public/js/eduedge_resource_center.bundle.js
          node --check eduedge/public/js/eduedge_settings_center.bundle.js
          node --check eduedge/public/js/eduedge_institution_operations_settings.bundle.js
          node --check eduedge/public/js/eduedge_home.bundle.js
          node --check eduedge/public/js/eduedge_academic_operations.bundle.js
          node --check eduedge/public/js/eduedge_cbt_operations.bundle.js
          node --check eduedge/public/js/eduedge_cbt_schedules.bundle.js
          node --check eduedge/public/js/eduedge_exam_templates.bundle.js
          node --check eduedge/public/js/eduedge_exam_template_builder.bundle.js
          node --check eduedge/public/js/eduedge_question_bank.bundle.js
          node --check eduedge/public/js/eduedge_question_responsibilities.bundle.js
          node --check eduedge/public/js/eduedge_question_builder.bundle.js
          node --check eduedge/public/js/eduedge_question_builder/rich_text_editor.js
          node --check eduedge/public/js/eduedge_question_batch.bundle.js
          node --check eduedge/public/js/eduedge_assessment_operations.bundle.js
          node --check eduedge/public/js/eduedge_report_cards.bundle.js
          node --check eduedge/public/js/eduedge_branch_governance.bundle.js
          node --check eduedge/eduedge/page/eduedge_home/eduedge_home.js
          node --check eduedge/eduedge/page/eduedge_setup_center/eduedge_setup_center.js
          node --check eduedge/eduedge/page/eduedge_academic_operations/eduedge_academic_operations.js
          node --check eduedge/eduedge/page/eduedge_programs/eduedge_programs.js
          node --check eduedge/eduedge/page/eduedge_program_offerings/eduedge_program_offerings.js
          node --check eduedge/eduedge/page/eduedge_class_arms/eduedge_class_arms.js
          node --check eduedge/eduedge/page/eduedge_my_profile/eduedge_my_profile.js
          node --check eduedge/eduedge/page/eduedge_institution_profile/eduedge_institution_profile.js
          node --check eduedge/eduedge/page/eduedge_cbt_operations/eduedge_cbt_operations.js
          node --check eduedge/eduedge/page/eduedge_cbt_schedules/eduedge_cbt_schedules.js
          node --check eduedge/eduedge/page/eduedge_exam_templates/eduedge_exam_templates.js
          node --check eduedge/eduedge/page/eduedge_exam_template_builder/eduedge_exam_template_builder.js
          node --check eduedge/eduedge/page/eduedge_question_bank/eduedge_question_bank.js
          node --check eduedge/eduedge/page/eduedge_question_responsibilities/eduedge_question_responsibilities.js
          node --check eduedge/eduedge/page/eduedge_cbt_invigilation/eduedge_cbt_invigilation.js
          node --check eduedge/eduedge/page/eduedge_cbt_marking/eduedge_cbt_marking.js
          node --check eduedge/eduedge/page/eduedge_cbt_attempt_review/eduedge_cbt_attempt_review.js
          node --check eduedge/eduedge/page/eduedge_question_builder/eduedge_question_builder.js
          node --check eduedge/eduedge/page/eduedge_question_batch/eduedge_question_batch.js
          node --check eduedge/eduedge/page/eduedge_assessment_operations/eduedge_assessment_operations.js
          node --check eduedge/eduedge/page/eduedge_report_cards/eduedge_report_cards.js
          node --check eduedge/eduedge/page/eduedge_branch_governance/eduedge_branch_governance.js
          node --check eduedge/eduedge/page/eduedge_settings_center/eduedge_settings_center.js
          node --check eduedge/eduedge/page/eduedge_institution_structure/eduedge_institution_structure.js
          node --check eduedge/eduedge/page/eduedge_academic_foundation/eduedge_academic_foundation.js
          node --check eduedge/eduedge/page/eduedge_institution_operations_settings/eduedge_institution_operations_settings.js
      - name: Run pure contract tests
        id: contract-tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s eduedge/tests -p "test_*.py" > contract-test.log 2>&1
          status=$?
          cat contract-test.log
          exit $status
      - name: Upload contract test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-diagnostics
          path: contract-test.log
          if-no-files-found: ignore
