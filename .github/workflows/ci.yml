name: EduEdge CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python
        run: python -m compileall eduedge
      - name: Run pure contract tests
        run: python -m unittest eduedge.tests.test_platform_config eduedge.tests.test_repository_contract
