[project]
name = "eduedge"
authors = [
    { name = "ProcessEdge Solutions Limited", email = "support@processedge.com.ng" }
]
description = "Education management and school intelligence for African schools on Frappe and ERPNext."
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B017", "B904", "E501", "W191"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
